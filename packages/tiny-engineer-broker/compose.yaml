# docker compose up -d --build
# Put TE_ROBOT_URL=..., TE_ROBOT_TOKEN=... and TE_BROKER_TOKEN=... in a .env file next to this file (git-ignored).
services:
  broker:
    build: .
    image: tiny-engineer-broker
    container_name: tiny-engineer-broker
    restart: unless-stopped
    ports:
      - "8790:8790"
    environment:
      TE_ROBOT_URL: ${TE_ROBOT_URL:-http://tiny-engineer.local}
      TE_ROBOT_TOKEN: ${TE_ROBOT_TOKEN:-}
      TE_BROKER_TOKEN: ${TE_BROKER_TOKEN:-}
      TE_STATE_TTL_S: "300"
      TE_ATTENTION_REPEAT_S: "30"
      TE_ATTENTION_MAX_S: "900"
    volumes:
      - state:/data
volumes:
  state:
