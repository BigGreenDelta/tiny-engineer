name: Tiny Engineer face broker
version: "0.1.0"
slug: tiny_engineer_broker
description: One writer for the Tiny Engineer face. Agent sessions file requests; the broker picks what plays.
url: https://github.com/BigGreenDelta/tiny-engineer/blob/esp32dev-port/docs/broker.md
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8790
panel_icon: mdi:robot-happy-outline
panel_title: Face broker
ports:
  8790/tcp: 8790
ports_description:
  8790/tcp: Broker API for agent hooks (POST /anim)
options:
  robot_url: http://192.168.1.164
  robot_token: ""
  state_ttl_s: 300
  attention_repeat_s: 30
  attention_max_s: 900
schema:
  robot_url: url
  robot_token: password?
  state_ttl_s: int(10,3600)
  attention_repeat_s: int(0,3600)
  attention_max_s: int(10,86400)
